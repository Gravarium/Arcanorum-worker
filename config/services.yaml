services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Platform\Hosting\CapabilityProbeInterface:
            tags: ['app.hosting_capability_probe']
        App\Platform\Hosting\HostingAdapterDefinitionInterface:
            tags: ['app.hosting_adapter']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Module\Settings\Controller\:
        resource: '../src/Module/Settings/Controller/'
        tags: ['controller.service_arguments']

    App\Module\Admin\Controller\:
        resource: '../src/Module/Admin/Controller/'
        tags: ['controller.service_arguments']

    App\Module\Advertising\Application\AdvertisingAdminGuard:
        alias: App\Module\Advertising\Infrastructure\SymfonyAdvertisingAdminGuard

    App\Module\Advertising\Application\AdvertisingStore:
        alias: App\Module\Advertising\Infrastructure\DoctrineAdvertisingStore

    App\Module\Advertising\Application\StatisticsStore:
        alias: App\Module\Advertising\Infrastructure\DoctrineStatisticsStore

    App\Platform\Hosting\PrivateStorageProbe:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'
            $storageDirectory: '%kernel.project_dir%/var/private'

    App\Platform\Hosting\RedisCapabilityProbe:
        arguments:
            $redisDsn: '%env(REDIS_URL)%'

    App\Platform\Hosting\PrivateFileStorage:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'
            $storageDirectory: '%kernel.project_dir%/var/private'
            $storageCapabilityProbe: '@App\Platform\Hosting\PrivateStorageProbe'

    App\Module\Backup\Service\DatabaseBackupService:
        arguments:
            $storageProbe: '@app.database_backup_storage_probe'
            $applicationDirectory: '%kernel.project_dir%'
            $publicDirectory: '%kernel.project_dir%/public'
            $privateDirectory: '%env(DATABASE_BACKUP_DIRECTORY)%'
            $encryptionKey: '%env(DATABASE_BACKUP_KEY)%'

    app.database_backup_storage_probe:
        class: App\Platform\Hosting\PrivateStorageProbe
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'
            $storageDirectory: '%env(DATABASE_BACKUP_DIRECTORY)%'

    App\Module\Backup\Service\PostgresBackupExecutorInterface:
        alias: App\Module\Backup\Service\ProcessPostgresBackupExecutor

    App\Platform\Hosting\PrivateObjectStorageInterface:
        alias: App\Service\PrivateObjectStorageGateway

    App\Service\PhpRuntimeInspectorInterface:
        alias: App\Service\NativePhpRuntimeInspector

    App\Module\Member\Security\MemberSecurityEmailSenderInterface:
        alias: App\Module\Member\Security\SymfonyMemberSecurityEmailSender

    App\Module\Settings\Service\EmailDeliveryConfiguration:
        arguments:
            $mailerDsn: '%env(string:MAILER_DSN)%'
            $fallbackFromAddress: '%env(string:MEMBER_SECURITY_FROM_ADDRESS)%'

    App\Platform\Hosting\RedisCachePoolAdapter:
        arguments:
            $redisDsn: '%env(REDIS_URL)%'

    App\Platform\Hosting\HostingCachePoolProvider:
        arguments:
            0: 'arcanorum'
            $safeFallback: '@App\Platform\Hosting\ArrayCachePoolAdapter'

    Symfony\Contracts\HttpClient\HttpClientInterface:
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

    App\Platform\Security\AdminMfaSecretCipher:
        arguments:
            $base64MasterKey: '%env(string:ADMIN_MFA_ENCRYPTION_KEY)%'

    App\Platform\Security\ContentSecurityPolicyReportOnlySubscriber:
        arguments:
            $routePolicies: '%app.security.csp_report_only_route_policies%'

    App\Module\Video\Service\VideoStreamSourceResolver:
        arguments:
            $allowedHosts: '%env(json:VIDEO_STREAM_ALLOWED_HOSTS)%'

    App\Module\Video\EventSubscriber\VideoStreamContentSecurityPolicySubscriber:
        arguments:
            $routePolicies: '%app.security.csp_report_only_route_policies%'

    App\Module\Feed\Service\CanonicalPublicUrlGenerator:
        arguments:
            $urlGenerator: '@router.default'
            $publicBaseUrl: '%env(string:PUBLIC_BASE_URL)%'

    App\Module\Feed\Controller\ContentFeedController:
        arguments:
            $publicUrls: '@App\Module\Feed\Service\CanonicalPublicUrlGenerator'

    App\Platform\Security\AttestationHttpClient:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments:
            - '@Symfony\Contracts\HttpClient\HttpClientInterface'

    App\Service\VideoProviderImportService:
        arguments:
            $httpClient: '@App\Platform\Security\AttestationHttpClient'
            $youtubeApiKey: '%env(string:YOUTUBE_DATA_API_KEY)%'
            $vimeoAccessToken: '%env(string:VIMEO_ACCESS_TOKEN)%'

    App\Module\Member\Security\GoogleOAuthClient:
        arguments:
            $httpClient: '@App\Platform\Security\AttestationHttpClient'
            $clientId: '%env(string:GOOGLE_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(string:GOOGLE_OAUTH_CLIENT_SECRET)%'
            $publicBaseUrl: '%env(string:PUBLIC_BASE_URL)%'

    App\Platform\Security\HttpRuntimeAttestationIncidentReporter:
        arguments:
            $httpClient: '@App\Platform\Security\AttestationHttpClient'
            $allowedHosts: '%env(json:RUNTIME_ATTESTATION_ALERT_ALLOWED_HOSTS)%'
            $targetId: '%env(string:RUNTIME_ATTESTATION_TARGET_ID)%'
            $endpoint: '%env(string:RUNTIME_ATTESTATION_ALERT_URL)%'
            $bearerToken: '%env(string:RUNTIME_ATTESTATION_ALERT_BEARER_TOKEN)%'

    App\Platform\Security\RuntimeAttestationIncidentReporterInterface:
        alias: App\Platform\Security\HttpRuntimeAttestationIncidentReporter

    App\Platform\Security\HttpRuntimeAttestationReplayProtection:
        arguments:
            $httpClient: '@App\Platform\Security\AttestationHttpClient'
            $allowedHosts: '%env(json:RUNTIME_ATTESTATION_REPLAY_ALLOWED_HOSTS)%'
            $endpoint: '%env(string:RUNTIME_ATTESTATION_REPLAY_URL)%'
            $bearerToken: '%env(string:RUNTIME_ATTESTATION_REPLAY_BEARER_TOKEN)%'

    App\Platform\Security\RuntimeAttestationReplayProtectionInterface:
        alias: App\Platform\Security\HttpRuntimeAttestationReplayProtection

    App\Platform\Security\HttpRuntimeAttestationReportProvider:
        arguments:
            $httpClient: '@App\Platform\Security\AttestationHttpClient'
            $allowedHosts: '%env(json:RUNTIME_ATTESTATION_REPORT_ALLOWED_HOSTS)%'
            $targetId: '%env(string:RUNTIME_ATTESTATION_TARGET_ID)%'
            $endpoint: '%env(string:RUNTIME_ATTESTATION_REPORT_URL)%'
            $bearerToken: '%env(string:RUNTIME_ATTESTATION_REPORT_BEARER_TOKEN)%'
            $trustedKeys: '%env(json:RUNTIME_ATTESTATION_TRUSTED_KEYS)%'

    App\Platform\Security\RuntimeAttestationReportProviderInterface:
        alias: App\Platform\Security\HttpRuntimeAttestationReportProvider

    App\Platform\Security\InteractiveConsoleTerminalInterface:
        alias: App\Platform\Security\NativeInteractiveConsoleTerminal
