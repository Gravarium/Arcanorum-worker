name: Hilfslauf für PHP-8.5-Lockdatei
on:
  push:
    branches: ['aw-001/full-foundation-20261021']
permissions:
  contents: read
jobs:
  resolve:
    name: Lockdatei erzeugen, keine Sicherheitsfreigabe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@248e3ca37a3e439628c6c2b0c88808bd9632af5e
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_pgsql, redis, xml, zip
          tools: composer:v2
      - name: Lockdatei mit Composer auf PHP 8.5 erzeugen
        shell: bash
        run: composer update --no-install --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - name: Generierte Sperrdatei bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-lock-${{ github.sha }}
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
