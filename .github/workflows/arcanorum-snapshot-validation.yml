          if [[ "$VALIDATION_SCOPE" == 'historical-core-data-rollback-testfix' || "$VALIDATION_SCOPE" == 'rollback-guard-migration-lock-audit' || "$VALIDATION_SCOPE" == 'rollback-guard-migration-lock-audit-followup' ]]; then
            composer validate --strict --no-interaction
            composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
            composer audit --locked --no-interaction
          else
            composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          fi

