      - name: Run the affected PostgreSQL migration rollback regressions
        working-directory: arcanorum-snapshot
        run: |
          mkdir -p var/test-results
          if [[ "$VALIDATION_SCOPE" == 'rollback-guard-final-pending-gates' || "$VALIDATION_SCOPE" == 'rollback-guard-migration-lock-audit-followup' || "$VALIDATION_SCOPE" == 'rollback-guard-migration-lock-audit' || "$VALIDATION_SCOPE" == 'rollback-guard-full-test-retry' || "$VALIDATION_SCOPE" == 'rollback-guard-rector-followup' || "$VALIDATION_SCOPE" == 'rollback-guard-style-followup' || "$VALIDATION_SCOPE" == 'rollback-guard-pending-gates' ]]; then
