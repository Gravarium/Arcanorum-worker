            php -l tests/Migration/AdvertisingMigrationRollbackTest.php
            php -l migrations/Version20261030230000.php
            php -l tests/Migration/HistoricalPrimaryDataMigrationRollbackTest.php
            php -l tests/Migration/HistoricalCoreDataMigrationRollbackTest.php
          fi
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          if [[ "$VALIDATION_SCOPE" != 'rollback-guard-final-pending-gates' ]]; then
            php bin/console doctrine:schema:validate --skip-sync
          fi

      - name: PHPStan on the affected migration and regressions
        if: inputs.validation_scope != 'historical-rollback-rector-only' && inputs.validation_scope != 'rollback-guard-style-followup' && inputs.validation_scope != 'rollback-guard-rector-followup' && inputs.validation_scope != 'rollback-guard-final-pending-gates'
