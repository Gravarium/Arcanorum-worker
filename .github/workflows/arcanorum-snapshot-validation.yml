            php -l migrations/Version20261026100000.php
            php -l migrations/Version20261018110000.php
            php -l migrations/Version20261026200000.php
            php -l migrations/Version20261025200000.php
            php -l migrations/Version20261022110000.php
            php -l migrations/Version20261022120000.php
            php -l migrations/Version20261023100000.php
            php -l migrations/Version20261026130000.php
            php -l migrations/Version20261030050500.php
            php -l tests/Migration/VideoMp3UploadConstraintMigrationTest.php
            php -l migrations/Version20261024100000.php
            php -l migrations/Version20261025120000.php
            php -l migrations/Version20261025160000.php
            php -l migrations/Version20261025170000.php
            php -l migrations/Version20261025200000.php
