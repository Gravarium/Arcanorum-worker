          elif [[ "$VALIDATION_SCOPE" == 'rollback-guard-advertising-assertion-retry' ]]; then
            php -l tests/Migration/AdvertisingMigrationRollbackTest.php
          elif [[ "$VALIDATION_SCOPE" == 'rollback-guard-migration-lock-audit-followup' ]]; then
            php -l migrations/Version20261030110000.php
            php -l migrations/Version20261028223107.php
