                if vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --using-cache=no "${files[@]}" > var/test-results/php-cs-fixer-fix.log 2>&1; then
                  changed_files=$(git diff --name-only -- "${files[@]}")
                  if [[ -n "$changed_files" ]]; then
                    printf 'PHP-CS-Fixer found style changes in these files:\n%s\n' "$changed_files"
                    python3 - "${files[@]}" <<'PY'
          import re
          import subprocess
          import sys

          diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--', *sys.argv[1:]],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          current_file = ''
          for line in diff.splitlines():
              if line.startswith('+++ b/'):
                  current_file = line[6:]
              elif line.startswith('@@ '):
                  match = re.match(r'@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', line)
                  if match:
                      print(f'PHP-CS-Fixer changed area: {current_file}:{match.group(1)}')
          PY
                  else
                    echo 'PHP-CS-Fixer did not identify changed files after a failed check.'
                  fi
                else
                  echo 'PHP-CS-Fixer could not produce a safe file summary.'
                fi
              elif [[ "$label" == phpstan ]]; then
                python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          try:
              result = json.loads(Path('var/test-results/phpstan.log').read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError):
              print('PHPStan finding summary unavailable; raw diagnostics withheld.')
          else:
              errors = result.get('totals', {}).get('errors')
              if isinstance(errors, int):
                  print(f'PHPStan error count: {errors}')
              shown = 0
              for file_name, file_data in result.get('files', {}).items():
                  if not isinstance(file_data, dict):
                      continue
                  for issue in file_data.get('messages', []):
                      if not isinstance(issue, dict):
                          continue
                      line_number = issue.get('line')
                      identifier = issue.get('identifier', 'unspecified')
                      if not isinstance(line_number, int):
                          line_number = 0
                      if not isinstance(identifier, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,80}', identifier):
                          identifier = 'unspecified'
                      print(f'PHPStan finding: {Path(file_name).name}:{line_number} ({identifier})')
                      shown += 1
                      if shown >= 12:
                          break
                  if shown >= 12:
                      break
              if shown == 0:
                  print('PHPStan finding locations unavailable; raw diagnostics withheld.')
          PY
              elif [[ "$label" == rector ]]; then
                if vendor/bin/rector process --config=rector.php --no-progress-bar --output-format=github "${files[@]}" > var/test-results/rector-fix.log 2>&1; then
                  changed_files=$(git diff --name-only -- "${files[@]}")
                  if [[ -n "$changed_files" ]]; then
                    printf 'Rector found changes in these files:\n%s\n' "$changed_files"
                    python3 - "${files[@]}" <<'PY'
          import re
          import subprocess
          import sys

          diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--', *sys.argv[1:]],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          current_file = ''
          for line in diff.splitlines():
              if line.startswith('+++ b/'):
                  current_file = line[6:]
              elif line.startswith('@@ '):
                  match = re.match(r'@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', line)
                  if match:
                      print(f'Rector changed area: {current_file}:{match.group(1)}')
          PY
                  else
                    echo 'Rector did not identify changed files after a failed dry run.'
                  fi
                else
                  echo 'Rector could not produce a safe file summary.'
                fi
                python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path('var/test-results/rector.log').read_text(encoding='utf-8', errors='replace')
          rules = sorted(set(re.findall(r'\b[A-Z][A-Za-z0-9]*Rector\b', log)))
          if rules:
              print('Rector rule IDs: ' + ', '.join(rules))
          else:
              print('Rector rule IDs were not present in the sanitized summary.')
          PY
              fi
              printf '%s: FAIL; diagnostic output withheld.\n' "$label"
              return 1
            fi
          }
          run_gate phpstan vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --error-format=json --memory-limit=1G "${files[@]}"
          run_gate php-cs-fixer vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --using-cache=no "${files[@]}"
