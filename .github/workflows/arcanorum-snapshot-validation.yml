          php-version: '8.5'
          extensions: gd, intl, mbstring, pcov, pdo_pgsql, redis, xml, zip
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer audit --locked --no-interaction

      - name: Check changed application PHP syntax
        run: |
          set -euo pipefail
          for file in \
            src/Module/News/Controller/NewsPublicController.php \
            src/Repository/ContentCategoryRepository.php \
            src/Repository/VideoRepository.php; do
            php -l "$file"
          done

      - name: Check changed regression PHP syntax
        run: |
          set -euo pipefail
          for file in \
            tests/Controller/CategoryTaxonomyFlowTest.php \
            tests/Controller/HomePageTest.php \
            tests/Controller/PublicContentTest.php; do
            php -l "$file"
          done

      - name: Lint News Twig templates
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          twig_output_file="$(mktemp)"
          if php bin/console lint:twig templates/news >"$twig_output_file" 2>&1; then
            cat "$twig_output_file"
          else
            python3 - "$twig_output_file" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-10:])[:1800]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=News Twig lint diagnostic::{message}')
          PY
            exit 1
          fi

      - name: Lint video Twig templates
        run: php bin/console lint:twig templates/videos

      - name: Compile Symfony development container
        run: |
          php bin/console lint:container --env=dev

      - name: Prepare PostgreSQL schema and validate Doctrine mapping
        run: |
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:schema:validate --skip-sync

      - name: PHPStan on affected application and regression files
        run: >-
          vendor/bin/phpstan analyse
          --configuration=phpstan.neon.dist
          --no-progress
          --error-format=github
          --memory-limit=1G
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php

      - name: PHP CS Fixer on affected PHP files
        run: >-
          vendor/bin/php-cs-fixer check
          --config=.php-cs-fixer.dist.php
          --diff
          --using-cache=no
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php

      - name: Rector dry run on affected PHP files
        run: >-
          vendor/bin/rector process
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php
          --config=rector.php
          --dry-run
          --no-progress-bar
          --output-format=github

      - name: Run only changed P-01/P-03 regressions
        run: |
          mkdir -p var/test-results
          php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.dist.xml \
            --fail-on-risky --fail-on-warning --fail-on-deprecation \
            --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
            --fail-on-empty-test-suite --log-junit=var/test-results/junit.xml \
            --filter='testVideoCategoryDirectoryShowsRootCategoriesAndParentPageShowsChildren|testNewestHomeVideosKeepAStableOrderWhenPublicationTimesMatch|testCategoryPagesKeepFiltersAcrossPaginationAndExcludeDrafts|testPublicPagesShowPublishedContentAndHideDrafts' \
            tests/Controller/CategoryTaxonomyFlowTest.php \
            tests/Controller/HomePageTest.php \
            tests/Controller/PublicContentTest.php
          python3 ../scripts/validate-arcanorum-junit.py var/test-results/junit.xml

