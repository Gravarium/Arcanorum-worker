name: Arcanorum snapshot validation

on:
  push:
    branches:
      - codex/arcanorum-snapshot-validation-sync-20261029
    paths:
      - 'arcanorum-snapshot/SOURCE_BASE_SHA'
      - '.github/workflows/arcanorum-snapshot-validation.yml'
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact source commit represented by the public snapshot."
        required: true
        type: string
      validation_scope:
        description: "Choose the full validation or the affected regression scope."
        required: true
        default: full
        type: choice
        options:
          - full
          - installer-bootstrap-focused
          - hosting-security-selection-focused
          - hosting-security-selection-tests-only
          - hosting-security-selection-test-quality-only
          - p01-p03-focused
          - automation-focused
          - analytics-focused
          - analytics-followup
          - analytics-tests-only
          - member-activity-focused
          - member-activity-followup
          - dashboard-latest-content
          - dashboard-latest-content-followup
          - admin-password-change-followup
          - video-provider-player-followup
          - video-provider-player-javascript-testfix
          - video-thumbnail-concurrency-followup
          - private-artwork-concurrency-followup
          - site-logo-concurrency-followup
          - admin-content-concurrency-followup
          - admin-content-tests-only
          - video-social-preview-cache-followup
          - public-media-cache-followup
          - auto-feature-threshold-followup
          - public-share-widget-followup
          - public-share-widget-testfix-followup
          - news-archive-filter-testfix-followup
          - news-module-disabled-followup
          - video-report-heading-testfix-followup
          - admin-design-settings-followup
          - classic-public-shell-followup
          - manual-video-source-check-followup
          - historical-core-data-rollback-testfix
          - historical-rollback-pending-gates
          - historical-rollback-rector-only
          - rollback-guard-pending-gates
          - rollback-guard-style-followup
          - rollback-guard-rector-followup
          - rollback-guard-full-test-retry
          - rollback-guard-migration-lock-audit
          - rollback-guard-migration-lock-audit-followup
          - rollback-guard-final-pending-gates
          - rollback-guard-advertising-assertion-retry
          - admin-login-mfa-configuration-followup
          - admin-bootstrap-attestation-defaults-focused

permissions:
  contents: read

concurrency:
  group: arcanorum-snapshot-${{ github.ref }}-${{ inputs.validation_scope || 'push' }}-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full')
    name: PHP 8.5, Symfony, PostgreSQL 18, Redis 8 and JavaScript
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: arcanorum-snapshot
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: 'postgresql://arcanorum_ci:ci-only-test-password@127.0.0.1:5432/arcanorum_test?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://127.0.0.1:6379'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcanorum_test
          POSTGRES_USER: arcanorum_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanorum_ci -d arcanorum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out public validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact source commit and exclude credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXPECTED_SOURCE_SHA="$(<SOURCE_BASE_SHA)"
          else
            EXPECTED_SOURCE_SHA="$SOURCE_COMMIT"
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The source commit must be a full lowercase Git SHA.' >&2
            exit 1
          fi
          printf '%s\n' "$EXPECTED_SOURCE_SHA" | cmp -s - SOURCE_BASE_SHA
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import re

          root = Path('.')
          blocked = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.as_posix()
              if (path.name.startswith('.env')
                  or '/secrets/' in f'/{relative}/'
                  or relative.startswith(('var/', 'vendor/', 'node_modules/', 'logs/', 'test-results/', 'coverage/', 'public/uploads/', 'storage/private/', 'backups/'))
                  or path.suffix.lower() in {'.pem', '.p12', '.key', '.sql', '.dump', '.sqlite', '.db'}):
                  blocked.append(relative)

          patterns = {
              'private-key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(rb'(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,})'),
              'aws-key': re.compile(rb'AKIA[0-9A-Z]{16}'),
              'stripe-live': re.compile(rb'sk_live_[A-Za-z0-9]{16,}'),
              'slack-token': re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}'),
          }
          matches = []
          for path in root.rglob('*'):
              if path.is_file():
                  data = path.read_bytes()
                  for name, pattern in patterns.items():
                      if pattern.search(data):
                          matches.append((name, path.as_posix()))

          if blocked or matches:
              for relative in blocked:
                  print(f'Forbidden file path: {relative}')
              for name, relative in matches:
                  print(f'Credential pattern {name} in {relative}')
              raise SystemExit('Snapshot security check failed.')
          print('Snapshot check passed: no forbidden files or high-confidence credential patterns.')

          manifest_path = root / 'SOURCE_MANIFEST.sha256'
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit('The source manifest is missing or unsafe.')
          manifest = {}
          for line in manifest_path.read_text(encoding='utf-8').splitlines():
              digest, separator, relative = line.partition('  ')
              path = Path(relative)
              if (not separator or not re.fullmatch(r'[a-f0-9]{64}', digest)
                      or not relative or path.is_absolute() or '..' in path.parts
                      or relative in manifest):
                  raise SystemExit('The source manifest contains an invalid entry.')
              manifest[relative] = digest

          actual = {}
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('The source snapshot contains a symbolic link.')
              if path.is_file() and path.name not in {'SOURCE_BASE_SHA', 'SOURCE_MANIFEST.sha256'}:
                  actual[path.relative_to(root).as_posix()] = sha256(path.read_bytes()).hexdigest()
          if actual != manifest:
              raise SystemExit('The source snapshot does not match its complete file manifest.')
          print(f'Source manifest passed: {len(actual)} files match.')
          PY

      - name: Set up PHP 8.5 and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0; Node 24
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring, pcov, pdo_pgsql, redis, xml, zip
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: '24'

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer audit --locked --no-interaction

      - name: Check PostgreSQL client and tracked PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --version | grep -Eq ' 18\.'
          mapfile -d '' php_files < <(
            find . -maxdepth 1 -type f -name '*.php' -print0
            for directory in bin config migrations src templates tests; do
              if [ -d "$directory" ]; then find "$directory" -type f -name '*.php' -print0; fi
            done
          )
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo 'No application PHP files were found.' >&2
            exit 1
          fi
          for file in "${php_files[@]}"; do php -l "$file"; done

      - name: Validate Symfony, Doctrine, PostgreSQL, Redis and assets
        run: |
          touch .env
          php bin/console lint:container --env=dev
          APP_ENV=prod APP_DEBUG=0 php bin/console lint:container --env=prod
          php bin/console lint:yaml config
          php bin/console lint:twig templates
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          # Arcanorum also owns migration-managed tables and PostgreSQL objects outside Doctrine ORM metadata.
          # Keep mapping validation and execute every migration; ORM schema synchronization would propose dropping those objects.
          php bin/console doctrine:schema:validate --skip-sync
          APP_ENV=prod APP_DEBUG=0 php bin/console asset-map:compile
          php -r '$pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=arcanorum_test", "arcanorum_ci", "ci-only-test-password"); echo "PostgreSQL connection passed\n";'
          php -r '$socket = stream_socket_client("tcp://127.0.0.1:6379", $error, $message, 3); if (!$socket) { exit(1); } fwrite($socket, "*1\r\n$4\r\nPING\r\n"); if (fgets($socket) !== "+PONG\r\n") { exit(1); } fclose($socket); echo "Redis connection passed\n";'

      - name: PHPStan level 10 with strict rules
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --error-format=github --memory-limit=1G

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --using-cache=no

      - name: Rector dry run
        run: vendor/bin/rector process --config=rector.php --dry-run --no-progress-bar --output-format=github

      - name: Psalm taint analysis
        run: |
          mkdir -p var/test-results
          vendor/bin/psalm --config=psalm.xml --taint-analysis --report=var/test-results/psalm.sarif

      - name: JavaScript syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              *.mjs) node --check "$file" ;;
              *) node --input-type=module --check < "$file" ;;
            esac
          done < <(find assets public tests/JavaScript -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node --test --test-reporter=tap tests/JavaScript/*.test.mjs

      - name: PHPUnit full suite with strict failures and coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/test-results
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.dist.xml \
            --fail-on-risky --fail-on-warning --fail-on-deprecation \
            --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
            --fail-on-empty-test-suite --log-junit=var/test-results/junit.xml \
            --coverage-text --coverage-clover=var/test-results/coverage.xml \
            > var/test-results/phpunit-full.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Full PHPUnit suite with coverage: FAIL; diagnostics and test artifacts withheld.'
            exit "$status"
          fi
          echo 'Full PHPUnit suite with coverage: PASS; detailed results withheld.'

      - name: Validate PHPUnit report completeness
        shell: bash
        run: |
          set -euo pipefail
          if python3 ../scripts/validate-arcanorum-junit.py var/test-results/junit.xml > var/test-results/junit-validation.log 2>&1; then
            echo 'JUnit report completeness: PASS.'
          else
            echo 'JUnit report completeness: FAIL; diagnostics withheld.'
            exit 1
          fi

      - name: Record sanitized full-suite source coordinates
        id: safe-full-failure-references
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('var/test-results/junit.xml')
          references = []
          if report.is_file():
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  root = None
              if root is not None:
                  for issue in (node for node in root.iter() if node.tag in {'failure', 'error'}):
                      details = issue.attrib.get('message', '') + ' ' + ''.join(issue.itertext())
                      for source_path, line_number in re.findall(
                          r'((?:src|tests)/[A-Za-z0-9_./-]+\.php):(\d+)', details,
                      ):
                          path = Path(source_path)
                          if '..' in path.parts:
                              continue
                          file_name = path.name
                          if re.fullmatch(r'[A-Za-z0-9_.-]+\.php', file_name):
                              reference = f'{file_name}:{line_number}'
                              if reference not in references:
                                  references.append(reference)
          value = ','.join(references[:6]) or 'unavailable'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'references={value}\n')
          PY

      - name: "Sanitized full-suite source coordinates (${{ steps.safe-full-failure-references.outputs.references || 'unavailable' }})"
        if: failure()
        run: echo 'Only source coordinates are shown; test output remains withheld.'

  validate-installer-bootstrap-focused:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'installer-bootstrap-focused'
    name: Focused installer bootstrap flow
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: arcanorum-snapshot
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: 'postgresql://arcanorum_ci:ci-only-test-password@127.0.0.1:5432/arcanorum_test?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://127.0.0.1:6379'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcanorum_test
          POSTGRES_USER: arcanorum_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanorum_ci -d arcanorum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out public validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact source commit and exclude credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXPECTED_SOURCE_SHA="$(<SOURCE_BASE_SHA)"
          else
            EXPECTED_SOURCE_SHA="$SOURCE_COMMIT"
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The source commit must be a full lowercase Git SHA.' >&2
            exit 1
          fi
          printf '%s\n' "$EXPECTED_SOURCE_SHA" | cmp -s - SOURCE_BASE_SHA
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import re

          root = Path('.')
          blocked = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.as_posix()
              if (path.name.startswith('.env')
                  or '/secrets/' in f'/{relative}/'
                  or relative.startswith(('var/', 'vendor/', 'node_modules/', 'logs/', 'test-results/', 'coverage/', 'public/uploads/', 'storage/private/', 'backups/'))
                  or path.suffix.lower() in {'.pem', '.p12', '.key', '.sql', '.dump', '.sqlite', '.db'}):
                  blocked.append(relative)

          patterns = {
              'private-key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(rb'(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,})'),
              'aws-key': re.compile(rb'AKIA[0-9A-Z]{16}'),
              'stripe-live': re.compile(rb'sk_live_[A-Za-z0-9]{16,}'),
              'slack-token': re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}'),
          }
          matches = []
          for path in root.rglob('*'):
              if path.is_file():
                  data = path.read_bytes()
                  for name, pattern in patterns.items():
                      if pattern.search(data):
                          matches.append((name, path.as_posix()))

          if blocked or matches:
              for relative in blocked:
                  print(f'Forbidden file path: {relative}')
              for name, relative in matches:
                  print(f'Credential pattern {name} in {relative}')
              raise SystemExit('Snapshot security check failed.')
          print('Snapshot check passed: no forbidden files or high-confidence credential patterns.')

          manifest_path = root / 'SOURCE_MANIFEST.sha256'
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit('The source manifest is missing or unsafe.')
          manifest = {}
          for line in manifest_path.read_text(encoding='utf-8').splitlines():
              digest, separator, relative = line.partition('  ')
