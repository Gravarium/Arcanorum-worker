  historical-core-data-rollback-testfix:
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'historical-core-data-rollback-testfix' || inputs.validation_scope == 'historical-rollback-pending-gates' || inputs.validation_scope == 'historical-rollback-rector-only' || inputs.validation_scope == 'rollback-guard-pending-gates' || inputs.validation_scope == 'rollback-guard-style-followup' || inputs.validation_scope == 'rollback-guard-rector-followup' || inputs.validation_scope == 'rollback-guard-full-test-retry' || inputs.validation_scope == 'rollback-guard-migration-lock-audit' || inputs.validation_scope == 'rollback-guard-migration-lock-audit-followup' || inputs.validation_scope == 'rollback-guard-final-pending-gates' || inputs.validation_scope == 'rollback-guard-advertising-assertion-retry')
    name: Rollback migration guard regression checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: 'postgresql://arcanorum_ci:ci-only-test-password@127.0.0.1:5432/arcanorum_test?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://127.0.0.1:6379'
      COMPOSER_PROCESS_TIMEOUT: '0'
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_NO_AUDIT: '1'
      VALIDATION_SCOPE: ${{ inputs.validation_scope }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcanorum_test
          POSTGRES_USER: arcanorum_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanorum_ci -d arcanorum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out public validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact source commit and exclude credentials
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: 'c96df1383aa1377bba3cf7ac3016a4ea5eb3742c'
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_SOURCE_SHA" | cmp -s - arcanorum-snapshot/SOURCE_BASE_SHA
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('arcanorum-snapshot')
          blocked = []
          patterns = {
              'private-key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(rb'(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,})'),
              'aws-key': re.compile(rb'AKIA[0-9A-Z]{16}'),
              'stripe-live': re.compile(rb'sk_live_[A-Za-z0-9]{16,}'),
              'slack-token': re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}'),
          }
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if (path.name.startswith('.env')
                  or '/secrets/' in f'/{relative}/'
                  or relative.startswith(('var/', 'vendor/', 'node_modules/', 'logs/', 'test-results/', 'coverage/', 'public/uploads/', 'storage/private/', 'backups/'))
                  or path.suffix.lower() in {'.pem', '.p12', '.key', '.sql', '.dump', '.sqlite', '.db'}):
                  blocked.append(relative)
              data = path.read_bytes()
              for name, pattern in patterns.items():
                  if pattern.search(data):
                      blocked.append(f'{relative} (credential-pattern: {name})')

          if blocked:
              raise SystemExit('Forbidden snapshot content: ' + ', '.join(blocked))
          print('Snapshot security check passed.')
          PY

      - name: Set up PHP 8.5 and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
