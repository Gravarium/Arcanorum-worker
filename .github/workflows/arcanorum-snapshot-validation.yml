              --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
              --fail-on-empty-test-suite --log-junit=var/test-results/junit.xml \
              --filter='testAdminVideoFormPrefillsSafeSourceModesAndShowsMinuteAndSecondFields|testFirstNewsAndVideoIterationPersistsContentAndRejectsUnsafeSources|testAdministratorCanBeCreatedAndCanLogInAndOut|AdminVideoThumbnailFlowTest|VideoAccessFlowTest|VideoSocialPreviewFlowTest|VideoSubtitleCacheFlowTest|VideoEditorialMetadataTest' \
              tests > var/test-results/phpunit-video-editorial.log 2>&1; then
              echo 'Targeted video and editorial regressions: PASS; detailed results withheld.'
            else
              echo 'Targeted video and editorial regressions: FAIL; reporting test names and coordinates only.'
              python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('var/test-results/junit.xml')
          if not report.is_file():
              print('JUnit report unavailable; detailed PHPUnit output remains withheld.')
          else:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  print('JUnit report could not be parsed; detailed PHPUnit output remains withheld.')
              else:
                  cases = root.findall('.//testcase')
                  failures = [
                      (case, child)
                      for case in cases
                      for child in case
                      if child.tag in {'failure', 'error'}
                  ]
                  safe_name = re.compile(r'\A[A-Za-z0-9_.\\]+\Z')
                  safe_method = re.compile(r'\A[A-Za-z0-9_]+(?: with data set #[0-9]+)?\Z')
                  safe_location = re.compile(r'(?:^|/)tests/([A-Za-z0-9_./-]+\.php)\Z')

                  for case, failure in failures:
                      class_name = case.get('classname', '')
                      method_name = case.get('name', '')
                      name = (
                          f'{class_name}::{method_name}'
                          if safe_name.fullmatch(class_name) and safe_method.fullmatch(method_name)
                          else 'test name withheld'
                      )
                      failure_text = failure.text or ''
                      trace_location = re.search(
                          r'(?:^|/)(tests/[A-Za-z0-9_./-]+\.php):(\d+)(?:\D|$)',
                          failure_text,
                          re.MULTILINE,
                      )
                      file_name = case.get('file', '')
                      line = case.get('line', '')
                      location_match = safe_location.search(file_name)
                      location = (
                          f'{trace_location.group(1)}:{trace_location.group(2)}'
                          if trace_location
                          else (
                              f'tests/{location_match.group(1)}:{line}'
                              if location_match and line.isdigit()
                              else 'location unavailable'
                          )
                      )
                      print(f'PHPUnit failure: {name} ({location})')
                      cache_match = re.search(
                          r'Cache-Control value:\s*([A-Za-z0-9 ,=.-]{0,120})',
                          f"{failure.get('message', '')} {failure_text}",
                      )
                      if cache_match:
                          observed_cache_control = cache_match.group(1).strip().rstrip('.') or '(empty)'
                          print(f'Observed Cache-Control directives: {observed_cache_control}')

                  if not failures:
                      print('No failed test coordinates were present in the JUnit report.')

                  suites = root.findall('.//testsuite')
                  summary_suites = [root] if root.get('tests', '').isdigit() else [
                      suite for suite in suites if not suite.findall('./testsuite')
                  ]
                  totals = {key: 0 for key in ('tests', 'assertions', 'failures', 'errors')}
                  for suite in summary_suites:
                      for key in totals:
                          raw = suite.get(key)
                          if raw is not None and raw.isdigit():
                              totals[key] += int(raw)
                  if 'tests' in totals:
                      print(
                          'PHPUnit summary: '
                          f"{totals['tests']} tests, {totals.get('assertions', 0)} assertions, "
                          f"{totals.get('failures', 0)} failures, {totals.get('errors', 0)} errors."
                      )
          PY
              exit 1
            fi
          else
            php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.dist.xml \
              --fail-on-risky --fail-on-warning --fail-on-deprecation \
              --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
