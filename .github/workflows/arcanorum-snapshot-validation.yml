          log = log_path.read_text(encoding='utf-8', errors='replace')
          states = sorted(set(re.findall(r'SQLSTATE\[([A-Z0-9]+)\]', log)))
          classes = sorted(set(re.findall(r'\b([A-Za-z_\\][A-Za-z0-9_\\]*(?:Exception|Error))\b', log)))
          versions = sorted(set(re.findall(r'DoctrineMigrations\\Version(\d+)', log)))
          lowered = log.lower()
          if 'connection refused' in lowered or 'could not connect' in lowered or 'connection timed out' in lowered:
              print('Migration failure category: PostgreSQL connection.')
          elif 'call to undefined function' in lowered:
              print('Migration failure category: undefined PHP function.')
          elif 'call to undefined method' in lowered:
              print('Migration failure category: undefined PHP method.')
          elif 'class ' in lowered and ' not found' in lowered:
              print('Migration failure category: missing PHP class.')
          elif 'cannot declare class' in lowered:
              print('Migration failure category: duplicate PHP class.')
          elif 'syntax error' in lowered:
              print('Migration failure category: PHP syntax.')
          elif 'typeerror' in lowered or 'must be of type' in lowered:
              print('Migration failure category: PHP type error.')
          elif 'allowed memory size' in lowered or 'out of memory' in lowered:
              print('Migration failure category: PHP memory limit.')
          elif 'maximum execution time' in lowered or 'execution timed out' in lowered:
              print('Migration failure category: execution timeout.')
          elif 'too few arguments' in lowered or 'argumentcounterror' in lowered:
              print('Migration failure category: PHP argument count.')
          elif 'undefined constant' in lowered:
              print('Migration failure category: undefined PHP constant.')
          elif 'cannot access' in lowered or 'must be compatible with' in lowered:
              print('Migration failure category: PHP declaration or visibility.')
          elif 'cannot redeclare' in lowered:
              print('Migration failure category: duplicate PHP declaration.')
          elif states:
              print('Migration failure SQLSTATE codes: ' + ', '.join(states))
          elif classes:
              print('Migration failure exception types: ' + ', '.join(item.rsplit('\\', 1)[-1] for item in classes))
          else:
              print('Migration failure category: execution error; detailed output withheld.')
          safe_locations = {
              f'{Path(file).name}:{line or alternate}'
              for file, line, alternate in re.findall(r'(?:in|In) ([^\s:]+?)(?:\.php)?(?::(\d+)| line (\d+))', log)
          }
          safe_locations.update(
              f'{Path(file).name}:{line}'
              for file, line in re.findall(r'(?m)^\s*In ([^\n]+?) line (\d+):?\s*$', log)
          )
          safe_locations.update(
              f'{Path(file).name}:{line}'
              for file, line in re.findall(r'(?m)^#\d+ ([^\s]+\.php):(\d+)', log)
          )
          safe_locations = sorted(safe_locations)
          if safe_locations:
              print('Migration failure code locations: ' + ', '.join(safe_locations[:5]))
          if versions:
              print('Migration versions involved: ' + ', '.join(versions))
          safe_words = {
              'abstract', 'access', 'allowed', 'argument', 'array', 'as', 'be', 'before', 'call',
              'cannot', 'class', 'compatible', 'compile', 'connection', 'declare', 'declared',
              'declaration', 'denied', 'does', 'error', 'exception', 'execution', 'expected',
              'fatal', 'few', 'file', 'found', 'function', 'implement', 'initialization',
              'initialized', 'interface', 'line', 'many', 'maximum', 'memory', 'method', 'must',
              'not', 'null', 'object', 'of', 'offset', 'permission', 'private', 'property',
              'protected', 'public', 'read', 'received', 'remaining', 'required', 'server', 'size',
              'static', 'string', 'syntax', 'the', 'therefore', 'time', 'to', 'too', 'trait',
              'type', 'undefined', 'unexpected', 'unknown', 'use', 'value', 'with', 'write',
          }
          for line in (line for line in log.splitlines() if 'Fatal' in line or 'Exception' in line):
              words = [word.lower() for word in re.findall(r'[A-Za-z]+', line) if word.lower() in safe_words]
              if words:
                  print('Migration safe error signature: ' + ' '.join(words[:12]))
