          --using-cache=no
          migrations/Version20261030230000.php
          src/Entity/Video.php
          src/Module/Video/Controller/VideoAdminController.php
          tests/Controller/AdminDashboardTest.php
          tests/Entity/VideoExternalSourceStatusTest.php
          tests/Module/Automation/Application/VideoSourceCheckTaskHandlerTest.php

      - name: Rector dry run on affected PHP files
        run: >-
