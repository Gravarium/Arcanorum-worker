                  actual[path.relative_to(root).as_posix()] = sha256(path.read_bytes()).hexdigest()
          if actual != manifest:
              raise SystemExit('The source snapshot does not match its complete file manifest.')
          print(f'Source manifest passed: {len(actual)} files match.')
          PY

      - name: Set up PHP 8.5 and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring, pcov, pdo_pgsql, redis, xml, zip
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer audit --locked --no-interaction

      - name: Check focused PHP syntax
        run: |
          php -l src/Command/ConfigureInstallerSecurityProfileCommand.php
          php -l src/Platform/Hosting/HostingSecurityFeature.php
          php -l src/Platform/Hosting/HostingSecurityFeatureChoice.php
          php -l tests/Command/ConfigureInstallerSecurityProfileCommandTest.php
          php -l tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php
          php -l tests/Controller/InstallerBootstrapFlowTest.php
          php -l tests/Controller/InstallerSecurityProfileControllerTest.php
          php -l tests/Controller/AdminHostingSecurityControllerTest.php

      - name: PHPStan on the installer flow and security selection tests
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --error-format=github --memory-limit=1G src/Command/ConfigureInstallerSecurityProfileCommand.php src/Platform/Hosting/HostingSecurityFeature.php src/Platform/Hosting/HostingSecurityFeatureChoice.php tests/Command/ConfigureInstallerSecurityProfileCommandTest.php tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php tests/Controller/InstallerBootstrapFlowTest.php tests/Controller/InstallerSecurityProfileControllerTest.php tests/Controller/AdminHostingSecurityControllerTest.php

      - name: PHP CS Fixer on the installer flow and security selection tests
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --using-cache=no src/Command/ConfigureInstallerSecurityProfileCommand.php src/Platform/Hosting/HostingSecurityFeature.php src/Platform/Hosting/HostingSecurityFeatureChoice.php tests/Command/ConfigureInstallerSecurityProfileCommandTest.php tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php tests/Controller/InstallerBootstrapFlowTest.php tests/Controller/InstallerSecurityProfileControllerTest.php tests/Controller/AdminHostingSecurityControllerTest.php

      - name: Rector dry run on the installer flow and security selection tests
        run: vendor/bin/rector process --config=rector.php --dry-run --no-progress-bar --output-format=github src/Command/ConfigureInstallerSecurityProfileCommand.php src/Platform/Hosting/HostingSecurityFeature.php src/Platform/Hosting/HostingSecurityFeatureChoice.php tests/Command/ConfigureInstallerSecurityProfileCommandTest.php tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php tests/Controller/InstallerBootstrapFlowTest.php tests/Controller/InstallerSecurityProfileControllerTest.php tests/Controller/AdminHostingSecurityControllerTest.php

      - name: Psalm taint analysis on the installer flow and security selection tests
        run: |
          mkdir -p var/test-results
          vendor/bin/psalm --config=psalm.xml --taint-analysis --report=var/test-results/psalm-installer-bootstrap.sarif src/Command/ConfigureInstallerSecurityProfileCommand.php src/Platform/Hosting/HostingSecurityFeature.php src/Platform/Hosting/HostingSecurityFeatureChoice.php tests/Command/ConfigureInstallerSecurityProfileCommandTest.php tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php tests/Controller/InstallerBootstrapFlowTest.php tests/Controller/InstallerSecurityProfileControllerTest.php tests/Controller/AdminHostingSecurityControllerTest.php

      - name: Prepare test database and lint installer translations and template
        run: |
          touch .env
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:schema:validate --skip-sync
          php bin/console lint:twig templates/installer/security_profile.html.twig
          php bin/console lint:twig templates/admin/system/security.html.twig
          php bin/console lint:yaml translations/messages.ar.yaml
          php bin/console lint:yaml translations/messages.de.yaml
          php bin/console lint:yaml translations/messages.en.yaml

      - name: Run focused installer browser flow and security selection tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/test-results
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.dist.xml \
            --fail-on-risky --fail-on-warning --fail-on-deprecation \
            --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
            --fail-on-empty-test-suite --log-junit=var/test-results/junit-installer-bootstrap.xml \
            tests/Command/ConfigureInstallerSecurityProfileCommandTest.php \
            tests/Platform/Hosting/HostingSecurityFeatureCatalogTest.php \
            tests/Controller/InstallerBootstrapFlowTest.php \
            tests/Controller/InstallerSecurityProfileControllerTest.php \
            tests/Controller/AdminHostingSecurityControllerTest.php > var/test-results/phpunit-installer-bootstrap.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Focused PHPUnit check failed; detailed test output is withheld from public logs."
            exit "$status"
          fi
          grep -E '^(OK|Tests:|Time:)' var/test-results/phpunit-installer-bootstrap.log
          python3 ../scripts/validate-arcanorum-junit.py var/test-results/junit-installer-bootstrap.xml

      - name: Record sanitized installer PHPUnit coordinates
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('var/test-results/junit-installer-bootstrap.xml')
          if not report.is_file():
              print('No installer JUnit failure report was available.')
              raise SystemExit(0)
          try:
              root = ET.parse(report).getroot()
          except ET.ParseError:
              print('Installer JUnit failure report could not be parsed.')
              raise SystemExit(0)

          count = 0
          for case in root.iter('testcase'):
              issue = next((child for child in case if child.tag in {'failure', 'error'}), None)
              if issue is None:
                  continue
              class_name = case.attrib.get('classname', '').rsplit('\\', 1)[-1]
              test_name = case.attrib.get('name', '')
              case_path = Path(case.attrib.get('file', ''))
              case_line = case.attrib.get('line', '')
              if not re.fullmatch(r'[A-Za-z0-9_]{1,120}', class_name):
                  class_name = case_path.stem if re.fullmatch(r'[A-Za-z0-9_]{1,120}', case_path.stem) else 'unknown-test-class'
              if not re.fullmatch(r'[A-Za-z0-9_]{1,160}', test_name):
                  test_name = 'unknown-test'
              details = issue.attrib.get('message', '') + ' ' + ''.join(issue.itertext())
              references = re.findall(
                  r'((?:src|tests)/[A-Za-z0-9_./-]+\.php)(?:\((\d+)\)|:(\d+))',
                  details,
              )
              references = [
                  (Path(path), line_a or line_b)
                  for path, line_a, line_b in references
                  if '..' not in Path(path).parts
              ]
              test_references = [(path, line) for path, line in references if 'tests' in path.parts]
              if test_references:
                  source_path, line_number = test_references[0]
                  file_name = source_path.name
              else:
                  file_name = case_path.name
                  line_number = case_line
              if not re.fullmatch(r'[A-Za-z0-9_.-]{1,120}\.php', file_name):
                  file_name = 'unknown.php'
              if not line_number.isdigit():
                  line_number = '0'
              print(f'Failed installer test: {class_name}::{test_name} ({file_name}:{line_number})')
              count += 1
              if count >= 6:
                  break
          if count == 0:
              print('No safe installer test coordinates were available; raw diagnostics withheld.')
          PY

  validate-hosting-security-selection-focused:
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'hosting-security-selection-focused' || inputs.validation_scope == 'hosting-security-selection-tests-only' || inputs.validation_scope == 'hosting-security-selection-test-quality-only')
    name: Focused hosting security selection and adapter checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: arcanorum-snapshot
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: 'postgresql://arcanorum_ci:ci-only-test-password@127.0.0.1:5432/arcanorum_test?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://127.0.0.1:6379'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcanorum_test
          POSTGRES_USER: arcanorum_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanorum_ci -d arcanorum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out public validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact source commit and exclude credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The source commit must be a full lowercase Git SHA.' >&2
            exit 1
          fi
          printf '%s\n' "$SOURCE_COMMIT" | cmp -s - SOURCE_BASE_SHA
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          root = Path('.')
          blocked = []
          patterns = {
              'private-key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(rb'(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,})'),
              'aws-key': re.compile(rb'AKIA[0-9A-Z]{16}'),
              'stripe-live': re.compile(rb'sk_live_[A-Za-z0-9]{16,}'),
              'slack-token': re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}'),
          }
          for path in root.rglob('*'):
              if path.is_symlink():
                  blocked.append(path.relative_to(root).as_posix())
                  continue
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if (path.name.startswith('.env')
                  or '/secrets/' in f'/{relative}/'
                  or relative.startswith(('var/', 'vendor/', 'node_modules/', 'logs/', 'test-results/', 'coverage/', 'public/uploads/', 'storage/private/', 'backups/'))
                  or path.suffix.lower() in {'.pem', '.p12', '.key', '.sql', '.dump', '.sqlite', '.db'}):
                  blocked.append(relative)
              data = path.read_bytes()
              if any(pattern.search(data) for pattern in patterns.values()):
                  blocked.append(relative)
          if blocked:
              raise SystemExit('Snapshot content gate failed; details withheld.')

          manifest_path = root / 'SOURCE_MANIFEST.sha256'
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit('Source manifest gate failed; details withheld.')
          expected = {}
          for line in manifest_path.read_text(encoding='utf-8').splitlines():
              digest, separator, relative = line.partition('  ')
              path = Path(relative)
              if (not separator or not re.fullmatch(r'[a-f0-9]{64}', digest)
                      or not relative or path.is_absolute() or '..' in path.parts
                      or relative in expected):
                  raise SystemExit('Source manifest gate failed; details withheld.')
              expected[relative] = digest
          actual = {
              path.relative_to(root).as_posix(): sha256(path.read_bytes()).hexdigest()
              for path in root.rglob('*')
              if path.is_file() and path.name not in {'SOURCE_BASE_SHA', 'SOURCE_MANIFEST.sha256'}
          }
          if actual != expected:
              raise SystemExit('Source manifest gate failed; details withheld.')
          print(f'Snapshot security and manifest gates: PASS ({len(actual)} files).')
          PY

      - name: Set up PHP 8.5 and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring, pcov, pdo_pgsql, redis, xml, zip
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Validate and install locked Composer dependencies
        run: |
          set -euo pipefail
