                          print(f'Failed test: {class_name}::{test_name} ({outcome}: {error_type})')
                          file_name = Path(case.attrib.get('file', '')).name
                          line_number = case.attrib.get('line', '')
                          if re.fullmatch(r'[A-Za-z0-9_.-]+\.php', file_name) and line_number.isdigit():
                              print(f'Failure location: {file_name}:{line_number}')
                          details = issue.attrib.get('message', '') + ' ' + ''.join(issue.itertext())
                          if re.search(r'http|status code|response', details, re.IGNORECASE):
                              print('Failure category: HTTP response assertion.')
                          elif re.search(r'expect|invok|call count|was called', details, re.IGNORECASE):
                              print('Failure category: interaction expectation.')
                          else:
                              print('Failure category: assertion details withheld.')
                          source_location = re.search(r'((?:src|tests)/[A-Za-z0-9_./-]+\.php):(\d+)', details)
                          if source_location and '..' not in Path(source_location.group(1)).parts:
                              print(f'Failure source: {Path(source_location.group(1)).name}:{source_location.group(2)}')
                          shown += 1
                          if shown >= 12:
                              print('Further failed test identifiers omitted.')
                              break
                      if shown >= 12:
                          break
                  if shown == 0:
                      print('No failed testcase identifier was present in JUnit.')
                  log = Path('var/test-results/phpunit-hosting-security-selection.log')
                  if log.is_file():
                      content = log.read_text(encoding='utf-8', errors='replace')
                      content = re.sub(r'\x1b\[[0-9;]*m', '', content)
                      summary = re.search(r'(?m)^Tests:.*$', content)
                      if summary:
                          safe_counts = re.findall(r'(?:Tests|Assertions|Failures|Errors|Warnings|Deprecations|Skipped|Incomplete|Risky|PHPUnit Notices): \d+', summary.group(0))
                          if safe_counts:
                              print('PHPUnit summary: ' + ', '.join(safe_counts))
                      safe_lines = (
                          r'OK(?:, but there were issues)?(?: \([0-9]+ tests?, [0-9]+ assertions?\))?',
                          r'(?:FAILURES|ERRORS|WARNINGS|RISKY|INCOMPLETE)!',
                          r'There (?:was|were) \d+ (?:failure|failures|error|errors|warning|warnings|risky test|risky tests|PHPUnit notice|PHPUnit notices|deprecation|deprecations|skipped test|skipped tests|incomplete test|incomplete tests):',
                      )
                      for line in content.splitlines():
                          line = line.strip()
                          if any(re.fullmatch(pattern, line) for pattern in safe_lines):
                              print('PHPUnit outcome: ' + line)
                      if 'Fatal error' in content or 'Uncaught ' in content:
                          print('PHP runtime failure occurred; raw diagnostic output withheld.')
                      notice_cases = sorted(set(re.findall(r'(?m)^\s*\d+\)\s+([A-Za-z0-9_\\]+::test[A-Za-z0-9_]+)\s*$', content)))
                      for case in notice_cases[:12]:
                          print('PHPUnit notice in test: ' + case.rsplit('\\', 1)[-1])
                      if not notice_cases and 'PHPUnit Notices' in content:
                          locations = sorted(set(re.findall(r'(?m)^\s*([A-Za-z0-9_./-]+\.php):(\d+)\s*$', content)))
                          for file_name, line_number in locations[:12]:
                              print(f'PHPUnit notice location: {Path(file_name).name}:{line_number}')
          PY
            exit "$status"
          fi
          echo 'Affected PHPUnit checks: PASS; detailed results withheld.'
          if python3 ../scripts/validate-arcanorum-junit.py var/test-results/junit-hosting-security-selection.xml > var/test-results/junit-validation.log 2>&1; then
            echo 'JUnit report completeness: PASS.'
          else
            echo 'JUnit report completeness: FAIL; diagnostic output withheld.'
            exit 1
          fi

      - name: Record sanitized PHPUnit source coordinates
        id: safe-failure-references
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('var/test-results/junit-hosting-security-selection.xml')
          references = []
          if report.is_file():
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  root = None
              if root is not None:
                  for issue in (node for node in root.iter() if node.tag in {'failure', 'error'}):
                      details = issue.attrib.get('message', '') + ' ' + ''.join(issue.itertext())
                      for source_path, line_number in re.findall(
                          r'((?:src|tests)/[A-Za-z0-9_./-]+\.php):(\d+)', details,
                      ):
                          path = Path(source_path)
                          if '..' in path.parts:
                              continue
                          file_name = path.name
                          if re.fullmatch(r'[A-Za-z0-9_.-]+\.php', file_name):
                              reference = f'{file_name}:{line_number}'
                              if reference not in references:
                                  references.append(reference)
          value = ','.join(references[:6]) or 'unavailable'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'references={value}\n')
          PY

      - name: "Sanitized PHPUnit source coordinates (${{ steps.safe-failure-references.outputs.references || 'unavailable' }})"
        if: failure()
        run: echo 'Only source coordinates are shown; test output remains withheld.'

  validate-p01-p03-focused:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'p01-p03-focused'
    name: Focused P-01/P-03 regression checks
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: arcanorum-snapshot
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: 'postgresql://arcanorum_ci:ci-only-test-password@127.0.0.1:5432/arcanorum_test?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://127.0.0.1:6379'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcanorum_test
          POSTGRES_USER: arcanorum_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanorum_ci -d arcanorum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out public validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact source commit and exclude credentials
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: 'c96df1383aa1377bba3cf7ac3016a4ea5eb3742c'
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_SOURCE_SHA" | cmp -s - SOURCE_BASE_SHA
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          blocked = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.as_posix()
              if (path.name.startswith('.env')
                  or '/secrets/' in f'/{relative}/'
                  or relative.startswith(('var/', 'vendor/', 'node_modules/', 'logs/', 'test-results/', 'coverage/', 'public/uploads/', 'storage/private/', 'backups/'))
                  or path.suffix.lower() in {'.pem', '.p12', '.key', '.sql', '.dump', '.sqlite', '.db'}):
                  blocked.append(relative)

          patterns = {
              'private-key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github-token': re.compile(rb'(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{30,})'),
              'aws-key': re.compile(rb'AKIA[0-9A-Z]{16}'),
              'stripe-live': re.compile(rb'sk_live_[A-Za-z0-9]{16,}'),
              'slack-token': re.compile(rb'xox[baprs]-[A-Za-z0-9-]{20,}'),
          }
          matches = []
          for path in root.rglob('*'):
              if path.is_file():
                  data = path.read_bytes()
                  for name, pattern in patterns.items():
                      if pattern.search(data):
                          matches.append((name, path.as_posix()))

          if blocked or matches:
              for relative in blocked:
                  print(f'Forbidden file path: {relative}')
              for name, relative in matches:
                  print(f'Credential pattern {name} in {relative}')
              raise SystemExit('Snapshot security check failed.')
          print('Snapshot check passed: no forbidden files or high-confidence credential patterns.')
          PY

      - name: Set up PHP 8.5 and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0; Node 24
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring, pcov, pdo_pgsql, redis, xml, zip
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer audit --locked --no-interaction

      - name: Check changed application PHP syntax
        run: |
          set -euo pipefail
          for file in \
            src/Module/News/Controller/NewsPublicController.php \
            src/Repository/ContentCategoryRepository.php \
            src/Repository/VideoRepository.php; do
            php -l "$file"
          done

      - name: Check changed regression PHP syntax
        run: |
          set -euo pipefail
          for file in \
            tests/Controller/CategoryTaxonomyFlowTest.php \
            tests/Controller/HomePageTest.php \
            tests/Controller/PublicContentTest.php; do
            php -l "$file"
          done

      - name: Lint News Twig templates
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          twig_output_file="$(mktemp)"
          if php bin/console lint:twig templates/news >"$twig_output_file" 2>&1; then
            cat "$twig_output_file"
          else
            python3 - "$twig_output_file" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-10:])[:1800]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=News Twig lint diagnostic::{message}')
          PY
            exit 1
          fi

      - name: Lint video Twig templates
        run: php bin/console lint:twig templates/videos

      - name: Compile Symfony development container
        run: |
          php bin/console lint:container --env=dev

      - name: Prepare PostgreSQL schema and validate Doctrine mapping
        run: |
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:schema:validate --skip-sync

      - name: PHPStan on affected application and regression files
        run: >-
          vendor/bin/phpstan analyse
          --configuration=phpstan.neon.dist
          --no-progress
          --error-format=github
          --memory-limit=1G
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php

      - name: PHP CS Fixer on affected PHP files
        run: >-
          vendor/bin/php-cs-fixer check
          --config=.php-cs-fixer.dist.php
          --diff
          --using-cache=no
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php

      - name: Rector dry run on affected PHP files
        run: >-
          vendor/bin/rector process
          src/Module/News/Controller/NewsPublicController.php
          src/Repository/ContentCategoryRepository.php
          src/Repository/VideoRepository.php
          tests/Controller/CategoryTaxonomyFlowTest.php
          tests/Controller/HomePageTest.php
          tests/Controller/PublicContentTest.php
          --config=rector.php
          --dry-run
          --no-progress-bar
          --output-format=github

      - name: Run only changed P-01/P-03 regressions
        run: |
          mkdir -p var/test-results
          php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.dist.xml \
            --fail-on-risky --fail-on-warning --fail-on-deprecation \
            --fail-on-phpunit-notice --fail-on-skipped --fail-on-incomplete \
            --fail-on-empty-test-suite --log-junit=var/test-results/junit.xml \
            --filter='testVideoCategoryDirectoryShowsRootCategoriesAndParentPageShowsChildren|testNewestHomeVideosKeepAStableOrderWhenPublicationTimesMatch|testCategoryPagesKeepFiltersAcrossPaginationAndExcludeDrafts|testPublicPagesShowPublishedContentAndHideDrafts' \
            tests/Controller/CategoryTaxonomyFlowTest.php \
            tests/Controller/HomePageTest.php \
            tests/Controller/PublicContentTest.php
          python3 ../scripts/validate-arcanorum-junit.py var/test-results/junit.xml

