'Signierte CLI-Anfrage': 'Signierte CLI-Anfrage'
'Der Cron-Host signiert die Nachricht mit HMAC-SHA-256 und dem privaten Schlüssel. Die Signatur bindet Versionskennung, feste Scheduler-Identität, aktuellen Unix-Zeitstempel und eine frische zufällige Nonce.': 'Der Cron-Host signiert die Nachricht mit HMAC-SHA-256 und dem privaten Schlüssel. Die Signatur bindet Versionskennung, feste Scheduler-Identität, aktuellen Unix-Zeitstempel und eine frische zufällige Nonce.'
'Jede Anfrage ist höchstens zwei Minuten gültig. Eine Nonce darf nur einmal verwendet werden. Erzeuge für jeden Lauf eine neue Nonce und Signatur; übermittle niemals den Schlüssel als Kommandozeilenargument oder HTTP-Feld.': 'Jede Anfrage ist höchstens zwei Minuten gültig. Eine Nonce darf nur einmal verwendet werden. Erzeuge für jeden Lauf eine neue Nonce und Signatur; übermittle niemals den Schlüssel als Kommandozeilenargument oder HTTP-Feld.'
'Die Signatur wird nur über die Standardeingabe gelesen und erscheint dadurch nicht in Prozessargumenten.': 'Die Signatur wird nur über die Standardeingabe gelesen und erscheint dadurch nicht in Prozessargumenten.'
'Ersetze im Beispiel den Projektpfad durch das private Arcanorum-Verzeichnis. Zeitstempel, Nonce und Signatur werden direkt vor jedem Lauf neu erzeugt. AUTOMATION_SCHEDULER_KEY muss bereits als private Laufzeitvariable gesetzt sein. Schlüssel und Signatur erscheinen weder in Prozessargumenten noch in einer HTTP-Anfrage; die Signatur wird nur über die Standardeingabe an den CLI-Befehl geleitet.': 'Ersetze im Beispiel den Projektpfad durch das private Arcanorum-Verzeichnis. Zeitstempel, Nonce und Signatur werden direkt vor jedem Lauf neu erzeugt. AUTOMATION_SCHEDULER_KEY muss bereits als private Laufzeitvariable gesetzt sein. Schlüssel und Signatur erscheinen weder in Prozessargumenten noch in einer HTTP-Anfrage; die Signatur wird nur über die Standardeingabe an den CLI-Befehl geleitet.'
