"Der Name der neuen Kategorie muss gültiges UTF-8 enthalten und darf höchstens 100 Zeichen lang sein.": "يجب أن يكون اسم الفئة الجديدة بترميز UTF-8 صالحًا وألا يتجاوز 100 محرف."
"Der Kategorien-Permalink konnte nicht aus dem Namen gebildet werden.": "تعذر إنشاء الرابط الدائم للفئة من اسمها."
"Der Kategorien-Permalink darf höchstens 120 Zeichen sowie Kleinbuchstaben, Ziffern und einzelne Bindestriche enthalten.": "يُسمح في الرابط الدائم للفئة بما يصل إلى 120 محرفًا من الأحرف اللاتينية الصغيرة والأرقام والواصلات المفردة."
"Ein Video darf einschließlich einer neuen Kategorie höchstens 50 Kategorien erhalten.": "يمكن ربط الفيديو بما يصل إلى 50 فئة، بما في ذلك الفئة الجديدة."
"Eine Videokategorie mit diesem Namen ist bereits vorhanden.": "توجد بالفعل فئة فيديو بهذا الاسم."
"Der Permalink wird bereits von einer Videokategorie verwendet.": "هذا الرابط الدائم مستخدم بالفعل لفئة فيديو."
"Der Sprachcode muss ein gültiger BCP-47-Code sein, zum Beispiel de oder en-US.": "أدخل رمز لغة صالحًا وفق BCP 47، مثل de أو en-US."
"Falls der Anbieterabruf nicht eingerichtet ist, trage die Videodaten manuell ein; den geprüften Link kannst du trotzdem speichern.": "إذا لم يكن جلب بيانات المزود مضبوطًا، فأدخل بيانات الفيديو يدويًا؛ ويمكنك مع ذلك حفظ الرابط الذي تم التحقق منه."
"Wähle eine oder mehrere Kategorien aus.": "اختر فئة واحدة أو أكثر."
"Noch keine Videokategorien vorhanden.": "لا توجد فئات فيديو متاحة بعد."
"Ein Video darf höchstens 50 Kategorien erhalten.": "يمكن إسناد 50 فئة كحد أقصى إلى الفيديو."
"Videos können nur Videokategorien zugeordnet werden.": "يمكن إسناد فئات الفيديو إلى مقاطع الفيديو فقط."
"Die Video-Kategorien wurden mit einem ungültigen Formularwert übermittelt.": "أُرسلت فئات الفيديو بقيمة نموذج غير صالحة."
"Wähle höchstens 50 gültige Video-Kategorien aus.": "اختر 50 فئة فيديو صالحة كحد أقصى."
"Die Video-Kategorien enthalten eine ungültige Auswahl.": "تتضمن فئات الفيديو اختيارًا غير صالح."
"Eine Video-Kategorie darf nicht mehrfach ausgewählt werden.": "لا يجوز اختيار فئة الفيديو أكثر من مرة."
"Die Video-Kategorien benötigen eine gültige Formularmarkierung.": "تتطلب فئات الفيديو علامة نموذج صالحة."
"Bitte wähle eine vorhandene Video-Kategorie.": "يرجى اختيار فئة فيديو موجودة."
"Mindestens eine ausgewählte Kategorie ist nicht verfügbar.": "فئة واحدة على الأقل من الفئات المختارة غير متاحة."
"Mindestens eine ausgewählte Kategorie wurde zwischenzeitlich geändert. Bitte lade die Seite neu.": "تم تغيير فئة واحدة على الأقل من الفئات المختارة أثناء فتح النموذج. أعد تحميل الصفحة."
"Bitte wähle genau ein gültiges Vorschaubild aus.": "اختر صورة معاينة صالحة واحدة فقط."
"Bitte verwende beim Bearbeiten den gesonderten Vorschaubildbereich.": "استخدم قسم صورة المعاينة المخصص عند تعديل الفيديو."
"Der sichere private Bildspeicher ist derzeit nicht verfügbar; das Vorschaubild wurde nicht gespeichert.": "مخزن الصور الخاص الآمن غير متاح حاليًا؛ لم تُحفظ صورة المعاينة."
"Ein neues privates Vorschaubild konnte nach dem Speicherfehler nicht bereinigt werden.": "تعذر حذف صورة المعاينة الخاصة الجديدة بعد فشل الحفظ."
"Ein abgelehntes privates Vorschaubild konnte nicht bereinigt werden.": "تعذر حذف صورة المعاينة الخاصة المرفوضة."
