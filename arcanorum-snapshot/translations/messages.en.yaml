'Nur eine gültige G-XXXXXXXXXX-Mess-ID wird akzeptiert. Die feste GA4-Einbindung lädt ausschließlich nach gültiger Zustimmung zu optionalen Cookies auf öffentlichen Inhaltsseiten. Suchbegriffe, Seitenpfade, Seitentitel und Referrer werden nicht übertragen; Google erhält bei Einwilligung weiterhin technische Verbindungsdaten.': 'Enter a valid G-XXXXXXXXXX measurement ID. The fixed GA4 integration loads only after valid consent to optional cookies and only on public content pages. Search terms, page paths, page titles, and referrers are not sent; Google still receives technical connection data after consent.'
