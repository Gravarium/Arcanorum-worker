'Private Scheduler-Einrichtung': 'Private scheduler setup'
'Aufgaben starten nur über die lokale Kommandozeile. Es gibt keinen öffentlichen Scheduler-Endpunkt.': 'Tasks can only be started through the local command line. There is no public scheduler endpoint.'
'Signaturschlüssel': 'Signing key'
'Der private Scheduler-Schlüssel ist konfiguriert.': 'The private scheduler key is configured.'
'Der private Scheduler-Schlüssel ist nicht konfiguriert. Aufträge werden bis dahin nicht ausgeführt.': 'The private scheduler key is not configured. Tasks will not run until it is set.'
'Setze AUTOMATION_SCHEDULER_KEY in der privaten Laufzeitkonfiguration außerhalb des Webverzeichnisses. Erzeuge einen zufälligen Schlüssel mit mindestens 32 Zeichen, zum Beispiel mit openssl rand -hex 32. Der Schlüssel wird auf dieser Seite weder angezeigt noch gespeichert.': 'Set AUTOMATION_SCHEDULER_KEY in private runtime configuration outside the web root. Generate a random key of at least 32 characters, for example with openssl rand -hex 32. The key is neither displayed nor stored on this page.'
'Signierte CLI-Anfrage': 'Signed CLI request'
'Der Cron-Host signiert die Nachricht mit HMAC-SHA-256 und dem privaten Schlüssel. Die Signatur bindet Versionskennung, feste Scheduler-Identität, aktuellen Unix-Zeitstempel und eine frische zufällige Nonce.': 'The cron host signs the message with HMAC-SHA-256 and the private key. The signature binds the protocol version, fixed scheduler identity, current Unix timestamp, and a fresh random nonce.'
'Jede Anfrage ist höchstens zwei Minuten gültig. Eine Nonce darf nur einmal verwendet werden. Erzeuge für jeden Lauf eine neue Nonce und Signatur; übermittle niemals den Schlüssel als Kommandozeilenargument oder HTTP-Feld.': 'Each request is valid for at most two minutes. A nonce can be used only once. Generate a new nonce and signature for each run; never pass the key as a command-line argument or HTTP field.'
'Die Signatur wird nur über die Standardeingabe gelesen und erscheint dadurch nicht in Prozessargumenten.': 'The signature is read only from standard input, so it does not appear in process arguments.'
'Ersetze im Beispiel den Projektpfad durch das private Arcanorum-Verzeichnis. Zeitstempel, Nonce und Signatur werden direkt vor jedem Lauf neu erzeugt. AUTOMATION_SCHEDULER_KEY muss bereits als private Laufzeitvariable gesetzt sein. Schlüssel und Signatur erscheinen weder in Prozessargumenten noch in einer HTTP-Anfrage; die Signatur wird nur über die Standardeingabe an den CLI-Befehl geleitet.': 'Replace the project path in the example with the private Arcanorum directory. A timestamp, nonce, and signature are generated immediately before each run. AUTOMATION_SCHEDULER_KEY must already be set as a private runtime variable. The key and signature appear neither in process arguments nor in an HTTP request; the signature is piped to the CLI command through standard input only.'
